version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  matmul:
    lang: python3-http
    handler: ./matmul
    
    image: bborann/matmul:latest
    
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "24"
    limits:
      memory: 256Mi
      cpu: 150m
    requests:
      memory: 256Mi
      cpu: 150m
    environment:
      exec_timeout: '10s'
      read_timeout: '10s'
      write_timeout: '10s'