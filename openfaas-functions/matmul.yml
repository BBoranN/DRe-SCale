version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  matmul:
    lang: python3-http
    handler: ./matmul
    
    image: bborann/matmul:latest
    
    labels:
      com.openfaas.scale.zero: "false"     # disable built-in scale-to-zero
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "24"
    limits:
      memory: 256Mi
      cpu: 150m
    requests:
      memory: 256Mi
      cpu: 150m
    environment:
      exec_timeout: '10s'
      read_timeout: '10s'
      write_timeout: '10s'

environment:
  exec_timeout: '20s'
  read_timeout: '20s'
  write_timeout: '20s'
  max_inflight: '1'